<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M.K. SERVICE - Technician Partner App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 font-sans text-gray-900 min-h-screen">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 space-y-6">
      <div class="text-center space-y-2">
        <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-black shadow-lg">
          <i class="fa-solid fa-helmet-safety"></i>
        </div>
        <h1 class="text-xl font-black text-slate-900">M.K. SERVICE PARTNER</h1>
        <p class="text-xs text-slate-500">Field Technician Cloud Portal</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Mobile Number / Partner ID</label>
          <input type="text" id="loginPhone" required placeholder="9876543210" class="w-full p-3 border border-slate-300 rounded-xl font-bold bg-slate-50">
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Password</label>
          <input type="password" id="loginPass" required placeholder="••••••" class="w-full p-3 border border-slate-300 rounded-xl font-bold bg-slate-50">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg text-sm transition">
          <i class="fa-solid fa-right-to-bracket mr-1"></i> Secure Login
        </button>
      </form>

      <div class="bg-blue-50 border border-blue-200 p-3.5 rounded-2xl space-y-2 text-xs">
        <span class="font-bold text-blue-900 block"><i class="fa-solid fa-circle-info mr-1"></i> डेमो लॉगिन:</span>
        <div class="flex gap-2">
          <button type="button" onclick="fillDemo('9876543210', '123456')" class="flex-1 bg-white border border-blue-300 py-2 rounded-xl font-bold text-blue-800 hover:bg-blue-100">
            Amit Sharma
          </button>
          <button type="button" onclick="fillDemo('9123456789', '123456')" class="flex-1 bg-white border border-blue-300 py-2 rounded-xl font-bold text-blue-800 hover:bg-blue-100">
            Rahul Kumar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN APP INTERFACE -->
  <div id="appContainer" class="hidden min-h-screen flex flex-col">
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
      <div class="max-w-4xl mx-auto px-4 py-3.5 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white">
            <i class="fa-solid fa-screwdriver-wrench"></i>
          </div>
          <div>
            <h1 class="font-bold text-base leading-none" id="hdrTechTitle">Technician App</h1>
            <p class="text-[11px] text-slate-400">M.K. SERVICE Partner</p>
          </div>
        </div>
        <button onclick="logoutTech()" class="bg-rose-600 hover:bg-rose-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold shadow">
          <i class="fa-solid fa-power-off mr-1"></i> Logout
        </button>
      </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6 flex-1 w-full space-y-6">
      <div class="bg-gradient-to-r from-blue-900 to-slate-900 text-white p-5 rounded-3xl shadow-lg flex justify-between items-center">
        <div>
          <span class="text-xs text-blue-300 font-bold uppercase tracking-wider block">Logged In Partner</span>
          <h2 class="text-lg font-black" id="welcomeTechName">Amit Sharma</h2>
        </div>
        <span class="bg-emerald-500/20 text-emerald-300 text-xs font-bold px-3 py-1.5 rounded-full border border-emerald-500/30 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Live
        </span>
      </div>

      <div class="space-y-4">
        <h3 class="text-xs font-black text-slate-800 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-briefcase text-blue-600"></i> मेरी असाइन की गई बुकिंग्स (Live Sync)
        </h3>
        
        <div id="techJobsListContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="col-span-2 text-center text-slate-400 text-xs py-6">क्लाउड से डेटा सिंक हो रहा है...</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // ⚠️ अपनी Firebase Project की डिटेल्स यहाँ भी वही डालें जो एडमिन ऐप में डाली हैं

apiKey: "AIzaSyCt5Wtgf0KNRW0CoLIOF-e8tC3Zo7Wcl1s",
  authDomain: "databasemk.firebaseapp.com",
  databaseURL: "https://databasemk-default-rtdb.firebaseio.com",
  projectId: "databasemk",
  storageBucket: "databasemk.firebasestorage.app",
  messagingSenderId: "112988164483",
  appId: "1:112988164483:web:06580d8e97dc2470dd26b6",
  measurementId: "G-VD31FWJPD3"
};
[03/11, 12:37 am] Idea 2: const firebaseConfig = {
  apiKey: "AIzaSyCt5Wtgf0KNRW0CoLIOF-e8tC3Zo7Wcl1s",
  authDomain: "databasemk.firebaseapp.com",
  databaseURL: "https://databasemk-default-rtdb.firebaseio.com",
  projectId: "databasemk",
  storageBucket: "databasemk.firebasestorage.app",
  messagingSenderId: "112988164483",
  appId: "1:112988164483:web:06580d8e97dc2470dd26b6",
  measurementId: "G-VD31FWJPD3"
};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let loggedInTechName = "";

    function fillDemo(phone, pass) {
      document.getElementById('loginPhone').value = phone;
      document.getElementById('loginPass').value = pass;
    }

    function handleLogin(e) {
      e.preventDefault();
      const phone = document.getElementById('loginPhone').value.trim();
      const pass = document.getElementById('loginPass').value.trim();

      db.ref('mk_technicians/' + phone).once('value').then((snapshot) => {
        const tech = snapshot.val();
        if (tech && tech.pass === pass) {
          loggedInTechName = tech.name;
          startTechApp();
        } else if ((phone === '9876543210' && pass === '123456') || (phone === '9123456789' && pass === '123456')) {
          loggedInTechName = phone === '9876543210' ? "Amit Sharma" : "Rahul Kumar";
          startTechApp();
        } else {
          alert("गलत मोबाइल नंबर या पासवर्ड!");
        }
      });
    }

    function startTechApp() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('hidden');
      document.getElementById('welcomeTechName').innerText = loggedInTechName;
      document.getElementById('hdrTechTitle').innerText = `M.K. SERVICE (${loggedInTechName})`;

      db.ref('mk_service_jobs').on('value', (snapshot) => {
        const data = snapshot.val();
        const allJobs = data ? Object.values(data) : [];
        const myJobs = allJobs.filter(j => j.tech === loggedInTechName);
        renderTechJobs(myJobs);
      });
    }

    function logoutTech() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appContainer').classList.add('hidden');
      document.getElementById('loginPass').value = "";
    }

    function updateJobStatus(key, newStatus) {
      db.ref('mk_service_jobs/' + key + '/status').set(newStatus).then(() => {
        alert("जॉब का स्टेटस अपडेट कर दिया गया है!");
      });
    }

    function renderTechJobs(jobs) {
      const container = document.getElementById('techJobsListContainer');
      if (jobs.length === 0) {
        container.innerHTML = `<div class="col-span-2 bg-white p-8 rounded-2xl text-center border border-slate-200 text-slate-400 text-xs">आपके लिए अभी कोई नई बुकिंग असाइन नहीं की गई है।</div>`;
        return;
      }

      container.innerHTML = jobs.map(j => `
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3 relative hover:shadow-md transition">
          <div class="flex justify-between items-start">
            <span class="font-black text-xs text-blue-900 bg-blue-50 px-2.5 py-1 rounded-lg border border-blue-200">${j.id}</span>
            <span class="text-[10px] px-2.5 py-1 rounded-lg font-black uppercase ${
              j.status === 'Completed' ? 'bg-emerald-100 text-emerald-800' :
              j.status === 'In-Progress' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800'
            }">${j.status}</span>
          </div>

          <div class="space-y-1">
            <h4 class="font-bold text-sm text-slate-800">${j.custName}</h4>
            <p class="text-xs text-slate-600"><strong>समस्या:</strong> ${j.serviceType}</p>
            <p class="text-xs text-slate-500"><i class="fa-solid fa-location-dot mr-1 text-rose-500"></i>${j.custAddr}</p>
          </div>

          <div class="pt-2 border-t flex justify-between items-center">
            <a href="tel:${j.custPhone}" class="text-xs font-bold text-blue-600 hover:text-blue-800 flex items-center gap-1">
              <i class="fa-solid fa-phone"></i> ${j.custPhone}
            </a>
            <span class="text-[10px] text-slate-400"><i class="fa-solid fa-calendar mr-1"></i>${j.date}</span>
          </div>

          <div class="grid grid-cols-3 gap-1.5 pt-2 border-t">
            <button onclick="updateJobStatus('${j.key}', 'Pending')" class="py-1.5 px-2 rounded-xl text-[10px] font-bold ${j.status === 'Pending' ? 'bg-amber-600 text-white' : 'bg-amber-50 text-amber-700 border border-amber-200'}">
              Pending
            </button>
            <button onclick="updateJobStatus('${j.key}', 'In-Progress')" class="py-1.5 px-2 rounded-xl text-[10px] font-bold ${j.status === 'In-Progress' ? 'bg-blue-600 text-white' : 'bg-blue-50 text-blue-700 border border-blue-200'}">
              In-Progress
            </button>
            <button onclick="updateJobStatus('${j.key}', 'Completed')" class="py-1.5 px-2 rounded-xl text-[10px] font-bold ${j.status === 'Completed' ? 'bg-emerald-600 text-white' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}">
              Completed
            </button>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
